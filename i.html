<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Приглашение в «Порог»</title>
<meta name="theme-color" content="#2E4E24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Порог">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
/* Страница-приглашение арендатора: определяет телефон (Android / iPhone / компьютер) и показывает свой путь */
:root{--bg:#ECEEE8;--card:linear-gradient(180deg,rgb(255 255 255/.82),rgb(255 255 255/.56));--edge:rgb(255 255 255/.7);--line:#DFE4D8;--ink:#1A2016;--muted:#687160;--accent:#2F5124;--accent-soft:#E2EBDA;--fill:#2E4E24;--fill-2:#1B3015;--lime:#7CC66A;
  --shadow:0 0 14px rgb(40 60 30/.06),0 10px 24px -12px rgb(40 60 30/.28);--display:"Unbounded","Golos Text",system-ui,sans-serif;--body:"Golos Text",system-ui,sans-serif;--glide:cubic-bezier(.22,1,.36,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1110;--card:linear-gradient(180deg,rgb(255 255 255/.065),rgb(255 255 255/.03));--edge:rgb(255 255 255/.07);--line:#2A2F2C;--ink:#E9EDE6;--muted:#949C90;--accent:#8CCB78;--accent-soft:#1E2A1B;--shadow:0 10px 24px -12px rgb(0 0 0/.6)}}
:root[data-theme="dark"]{--bg:#0F1110;--card:linear-gradient(180deg,rgb(255 255 255/.065),rgb(255 255 255/.03));--edge:rgb(255 255 255/.07);--line:#2A2F2C;--ink:#E9EDE6;--muted:#949C90;--accent:#8CCB78;--accent-soft:#1E2A1B;--shadow:0 10px 24px -12px rgb(0 0 0/.6)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.hero{border-radius:24px;padding:22px 20px;color:#EEF4EA;background:radial-gradient(90% 120% at 100% 0%,rgb(124 198 106/.26),transparent 60%),linear-gradient(160deg,var(--fill),var(--fill-2));box-shadow:0 26px 42px -16px rgb(20 36 15/.6);display:flex;gap:14px;align-items:center}
.logo{width:64px;height:64px;border-radius:28%;display:grid;place-items:center;background:linear-gradient(160deg,#4A7A3D,#22401A);box-shadow:inset 0 1px 0 rgb(255 255 255/.14),0 8px 18px -8px rgb(0 0 0/.5);flex:none}
.logo svg{width:76%;height:76%}
.hero h1{font:600 22px/1.15 var(--display);margin:0}
.hero p{margin:4px 0 0;color:rgb(238 244 234/.75)}
.card{background:var(--card);border:1px solid var(--edge);border-radius:20px;padding:16px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.label{color:var(--muted);font-size:13px}
.code{font:500 30px/1.1 var(--display);letter-spacing:.12em;margin:4px 0 10px;font-variant-numeric:tabular-nums}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:999px;padding:14px 18px;font:600 15px var(--body);cursor:pointer;text-decoration:none;background:linear-gradient(180deg,var(--fill),var(--fill-2));color:#fff;box-shadow:0 8px 20px -10px rgb(27 48 21/.6)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--edge);box-shadow:var(--shadow)}
.btn:active{transform:scale(.97)}
.btn small{font-weight:500;opacity:.75}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px}
.ic{display:inline-block;vertical-align:-3px;width:18px;height:18px;color:var(--accent)}
.note{color:var(--muted);font-size:13px;margin:0}
.warn{background:color-mix(in srgb,#C98A00 14%,transparent);border-radius:14px;padding:10px 12px;font-size:13px;margin:0}
.os{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.os a{color:var(--muted);padding:4px 10px;border-radius:999px;border:1px solid var(--line);text-decoration:none}
.os a[aria-current="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1A2016;color:#EEF4EA;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.a{animation:up .5s var(--glide) both;animation-delay:calc(var(--i,0)*50ms)}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
@media (prefers-reduced-motion:reduce){.a{animation:none}}
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast" role="status"></div>
<script>
/* Определение телефона по данным, которые браузер сообщает сам (User-Agent). ?os=android|ios|desktop — посмотреть другой вариант */
const Q=new URLSearchParams(location.search);
const CODE=(Q.get('c')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
const NEW=Q.has('new');
const UA=navigator.userAgent;
const IOS=/iPhone|iPad|iPod/i.test(UA)||(/Macintosh/.test(UA)&&navigator.maxTouchPoints>1);
const AND=/Android/i.test(UA);
const DETECTED=IOS?'ios':AND?'android':'desktop';
const OS=['ios','android','desktop'].includes(Q.get('os'))?Q.get('os'):DETECTED;
/* встроенный браузер мессенджера на iPhone не умеет «На экран „Домой“» — нужен Safari */
const INAPP=/Telegram|FBAN|FBAV|Instagram|VKClient|OKApp|MAX\//i.test(UA)||(IOS&&!/Safari\//.test(UA));
let LANG='ru';try{if(localStorage.getItem('arenda-lang')==='en')LANG='en'}catch(e){}
try{const t=localStorage.getItem('arenda-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}
const T={ru:{
  title:'Вас пригласили в «Порог»',sub:'Здесь вы будете вносить оплату, передавать показания счётчиков и сообщать о поломках',
  code:'Код приглашения',copy:'Скопировать код',copied:'Код скопирован',nocode:'В ссылке нет кода — попросите арендодателя прислать приглашение ещё раз.',
  andTitle:'Установите приложение',andInstall:'Установить из RuStore',andWeb:'Открыть в браузере',andWebSub:'без установки',
  andSteps:['Нажмите «Установить из RuStore».','Откройте «Порог» → «Я арендатор, у меня есть код».','Введите код выше, свой номер телефона и код из СМС.'],
  notPub:'Приложение ещё не опубликовано в RuStore — это пример. Пока откройте в браузере.',
  iosTitle:'Добавьте «Порог» на экран «Домой»',iosWhy:'Так он откроется как приложение, и будут приходить напоминания об оплате и показаниях.',
  inApp:'Вы открыли ссылку внутри мессенджера. Нажмите «⋯» или значок компаса и выберите «Открыть в Safari» — добавить на экран «Домой» можно только оттуда.',
  iosSteps:['Нажмите внизу Safari «Поделиться» <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>.','Выберите «На экран „Домой“» и нажмите «Добавить».','Откройте «Порог» с экрана «Домой» → «Я арендатор, у меня есть код» → введите код выше.','Разрешите уведомления, когда приложение спросит.'],
  iosWeb:'Открыть сразу в браузере',iosWebSub:'без напоминаний',
  deskTitle:'Откройте ссылку на телефоне',deskSub:'Приложение для арендатора работает на телефоне. Если вы уже на нём — выберите вариант ниже.',
  deskAnd:'У меня Android',deskIos:'У меня iPhone',
  see:'Посмотреть как на:',and:'Android',ios:'iPhone',desk:'Компьютере',det:'определено автоматически',
  foot:'Прототип. Ссылку присылает арендодатель из карточки квартиры: «Пригласить арендатора».'},
en:{
  title:'You’re invited to Porog',sub:'Here you’ll pay rent, send meter readings and report repairs',
  code:'Invitation code',copy:'Copy code',copied:'Code copied',nocode:'The link has no code — ask your landlord to send the invitation again.',
  andTitle:'Install the app',andInstall:'Install from RuStore',andWeb:'Open in browser',andWebSub:'no install',
  andSteps:['Tap “Install from RuStore”.','Open Porog → “I’m a tenant, I have a code”.','Enter the code above, your phone number and the SMS code.'],
  notPub:'The app isn’t on RuStore yet — this is a prototype. Open it in the browser for now.',
  iosTitle:'Add Porog to your Home Screen',iosWhy:'It will open like an app, and you’ll get rent and meter-reading reminders.',
  inApp:'You opened the link inside a messenger. Tap “⋯” or the compass icon and choose “Open in Safari” — Add to Home Screen only works there.',
  iosSteps:['Tap Share <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg> at the bottom of Safari.','Choose “Add to Home Screen” and tap “Add”.','Open Porog from the Home Screen → “I’m a tenant, I have a code” → enter the code above.','Allow notifications when asked.'],
  iosWeb:'Open in the browser now',iosWebSub:'no reminders',
  deskTitle:'Open this link on your phone',deskSub:'The tenant app works on a phone. If you’re on one already, pick an option below.',
  deskAnd:'I have Android',deskIos:'I have an iPhone',
  see:'Preview for:',and:'Android',ios:'iPhone',desk:'Computer',det:'detected automatically',
  foot:'Prototype. The landlord sends this link from the property card: “Invite tenant”.'}}[LANG];
const LOGO='<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M15 37V21a9 9 0 0 1 18 0v16" stroke="#EEF4EA" stroke-width="3.4" stroke-linecap="round"/><path d="M9.5 38h29" stroke="#9BD98A" stroke-width="4" stroke-linecap="round"/><circle cx="27.6" cy="28" r="1.7" fill="#EEF4EA"/></svg>';
const web='./?'+(NEW?'new&':'')+(CODE?'invite='+CODE:'');
const osLink=o=>{const p=new URLSearchParams(location.search);p.set('os',o);return '?'+p.toString()};
const codeCard=CODE?`<div class="card"><div class="label">${T.code}</div><div class="code">${CODE}</div><button class="btn ghost" data-copy>${T.copy}</button></div>`:`<p class="warn">${T.nocode}</p>`;
const steps=a=>`<ol class="steps">${a.map(s=>`<li><span>${s}</span></li>`).join('')}</ol>`;
let body='';
if(OS==='android')body=`${codeCard}<div class="card"><div class="label">${T.andTitle}</div>${steps(T.andSteps)}</div>
  <button class="btn" data-store>${T.andInstall}</button><a class="btn ghost" href="${web}">${T.andWeb} <small>· ${T.andWebSub}</small></a>`;
else if(OS==='ios')body=`${INAPP&&OS===DETECTED?`<p class="warn">${T.inApp}</p>`:''}${codeCard}<div class="card"><div class="label">${T.iosTitle}</div><p class="note" style="margin:4px 0 12px">${T.iosWhy}</p>${steps(T.iosSteps)}</div>
  <a class="btn ghost" href="${web}">${T.iosWeb} <small>· ${T.iosWebSub}</small></a>`;
else body=`<div class="card"><div class="label">${T.deskTitle}</div><p class="note" style="margin-top:4px">${T.deskSub}</p></div>${codeCard}
  <a class="btn ghost" href="${osLink('android')}">${T.deskAnd}</a><a class="btn ghost" href="${osLink('ios')}">${T.deskIos}</a>`;
document.getElementById('app').innerHTML=`<div class="hero">${`<span class="logo">${LOGO}</span>`}<div><h1>${T.title}</h1><p>${T.sub}</p></div></div>${body}
  <div class="os"><span style="width:100%;text-align:center">${T.see}</span>${[['android',T.and],['ios',T.ios],['desktop',T.desk]].map(([k,l])=>`<a href="${osLink(k)}" aria-current="${OS===k}">${l}${k===DETECTED?' ✓':''}</a>`).join('')}</div>
  <p class="note" style="text-align:center">✓ — ${T.det}. ${T.foot}</p>`;
[...document.getElementById('app').children].forEach((el,i)=>{el.classList.add('a');el.style.setProperty('--i',i)});
const toast=t=>{const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)};
document.addEventListener('click',e=>{
  if(e.target.closest('[data-copy]')){(navigator.clipboard?navigator.clipboard.writeText(CODE):Promise.reject()).then(()=>toast(T.copied),()=>toast(CODE))}
  if(e.target.closest('[data-store]'))toast(T.notPub)});
</script>
</body>
</html>
