services:
  pocketbase:
    build: .
    restart: unless-stopped
    volumes:
      - pb_data:/pb/pb_data
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www:/srv/www:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      - pocketbase

networks:
  internal:

volumes:
  pb_data:
  caddy_data:
  caddy_config:
